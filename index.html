<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Side Scroller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">Retro Browser Adventure Reloaded</p>
          <h1>Elemental Side Scroller</h1>
        </div>
        <div class="scoreboard" aria-label="Game scoreboard">
          <div class="score-card">
            <span class="label">Mobs Killed</span>
            <strong id="killsValue">0</strong>
          </div>
          <div class="score-card">
            <span class="label">Time Elapsed</span>
            <strong id="timeValue">0s</strong>
          </div>
          <div class="score-card">
            <span class="label">Level</span>
            <strong id="levelValue">Menu</strong>
          </div>
          <div class="score-card">
            <span class="label">Hero</span>
            <strong id="heroValue">None</strong>
          </div>
        </div>
      </header>

      <section class="game-frame">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="960" height="540" aria-label="2D side scroller game area"></canvas>
          <section id="menuOverlay" class="menu-overlay" aria-live="polite">
            <div class="menu-card">
              <p class="menu-kicker" id="menuKicker">Level 1</p>
              <h2 id="menuTitle">Choose Your Hero</h2>
              <p id="menuDescription">Pick a character, then press Start to begin level 1.</p>

              <div class="character-grid" id="characterGrid">
                <button class="character-card is-selected" data-character="fire" type="button">
                  <img src="fire.png" alt="Fire character">
                  <strong>Fire</strong>
                  <span>Fireball</span>
                </button>
                <button class="character-card" data-character="leaf" type="button">
                  <img src="leaf.png" alt="Leaf character">
                  <strong>Leaf</strong>
                  <span>Triple leaf spread</span>
                </button>
                <button class="character-card" data-character="lightning" type="button">
                  <img src="light.png" alt="Lightning character">
                  <strong>Lightning</strong>
                  <span>Short laser beam</span>
                </button>
                <button class="character-card" data-character="fairy" type="button">
                  <img src="char.png" alt="Fairy character">
                  <strong>Fairy</strong>
                  <span>Butterfly burst bow</span>
                </button>
              </div>

              <div class="menu-actions">
                <button id="startButton" class="action-button" type="button">Start Game</button>
                <button id="restartButton" class="action-button secondary" type="button" hidden>Back To Level 1 Menu</button>
              </div>
            </div>
          </section>
          <section class="touch-controls" aria-label="Touch controls">
            <div class="touch-pad">
              <div class="pad-spacer"></div>
              <button class="touch-button direction up" data-key="arrowup" type="button" aria-label="Up">▲</button>
              <div class="pad-spacer"></div>
              <button class="touch-button direction left" data-key="arrowleft" type="button" aria-label="Left">◀</button>
              <button class="touch-button direction down" data-key="arrowdown" type="button" aria-label="Down">▼</button>
              <button class="touch-button direction right" data-key="arrowright" type="button" aria-label="Right">▶</button>
            </div>
            <div class="touch-actions">
              <button class="touch-button action shoot" data-key=" " type="button" aria-label="Shoot">Shoot</button>
            </div>
          </section>
        </div>
      </section>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
